    name: release

    on:
      pull_request:
        types: [closed]

    permissions:
      contents: write
      pull-requests: read


    concurrency:
      group: release-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false

    jobs:
      release:
        if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
        runs-on: ubuntu-latest
        outputs:
          release_tag: ${{ steps.release.outputs.release_tag }}
        steps:
          - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
              fetch-depth: 0
          - name: Determine version bump from labels
            id: bump
            run: |
              bump=""
              for label in ${{ join(github.event.pull_request.labels.*.name, ' ') }}; do
                case "$label" in
                  major) bump="major" ;;
                  minor) [ "$bump" != "major" ] && bump="minor" ;;
                  patch) [ "$bump" != "major" ] && [ "$bump" != "minor" ] && bump="patch" ;;
                esac
              done
              echo "bump=$bump" >> "$GITHUB_OUTPUT"
          - name: Tag and release
            id: release
            if: steps.bump.outputs.bump != ''
            env:
              GH_TOKEN: ${{ github.token }}
              MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
            run: |
              # Re-runs must reuse the release already associated with this PR's
              # merge commit rather than incrementing the version a second time.
              existing="$(git tag --points-at "$MERGE_SHA" --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
              if [ -n "$existing" ]; then
                release_tag="$existing"
              else
                bump="${{ steps.bump.outputs.bump }}"
                latest="$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
                if [ -z "$latest" ]; then major=0; minor=0; patch=0; else
                  latest="${latest#v}"
                  IFS=. read -r major minor patch <<< "$latest"
                fi
                case "$bump" in
                  major) major=$((major+1)); minor=0; patch=0 ;;
                  minor) minor=$((minor+1)); patch=0 ;;
                  patch) patch=$((patch+1)) ;;
                esac
                release_tag="v$major.$minor.$patch"
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag -a "$release_tag" "$MERGE_SHA" -m "Release $release_tag"
                git push origin "$release_tag"
              fi
              gh release view "$release_tag" >/dev/null 2>&1 || gh release create "$release_tag" --target "$MERGE_SHA" --generate-notes
              echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

